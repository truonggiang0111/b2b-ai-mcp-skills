name: Publish MCP Servers to Official Registry

on:
  push:
    branches: [main]
    paths:
      - 'servers/**/server.json'
      - '.github/workflows/publish-mcp-registry.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download mcp-publisher v1.8.16
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf /tmp/mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          rm -f /tmp/mcp-publisher.tar.gz
          chmod +x /usr/local/bin/mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Validate and publish all server.json manifests
        run: |
          for file in servers/*/server.json; do
            echo "=== Validating $file ==="
            mcp-publisher validate "$file"
            name=$(jq -r '.name' "$file")
            version=$(jq -r '.version' "$file")
            encoded_name=${name//\//%2F}
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${version}")
            if [ "$status" = "200" ]; then
              echo "Already published ${name}@${version}, skipping"
            else
              echo "=== Publishing ${name}@${version} ($file) ==="
              mcp-publisher publish "$file"
            fi
          done
